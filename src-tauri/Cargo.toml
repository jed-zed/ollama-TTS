[package]
name = "app"
version = "0.9.0"
description = "Ollama TTS Adapter - A Tauri App with Rust Backend"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP server (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }

# System proxy detection (reads Windows/macOS/Linux system proxy settings)
sysproxy = "0.3"

# Base64 encoding
base64 = "0.22"

# Async streams
futures = "0.3"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
regex = "1"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
tempfile = "3"

# WebSocket client (for Xunfei speech recognition)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
hmac = "0.12"
sha2 = "0.10"
url = "2"

# Audio playback
rodio = { version = "0.19", default-features = false, features = ["wav"] }

# MCP 插件
tauri-plugin-mcp-gui = { path = "../tauri-plugin-mcp" }
tauri-plugin-global-shortcut = "2"
enigo = "0.3"
arboard = "3"
